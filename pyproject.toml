[build-system]
requires = ["setuptools>=70.1", "wheel", "pybind11>=2.12", "ninja", "packaging"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-kv"
version = "0.1.0"
description = "Sparse + quantized KV cache with fused CUDA eviction kernels"
requires-python = ">=3.9"
license = { text = "MIT" }

# Floors, not pins. Exact pins here made the INSTALLED package's metadata fight
# every later upgrade: pip kept resolving transformers back to 4.44.2 and
# accelerate to 0.33.0, which broke Qwen3 (its tokenizer format needs a
# 2025-era transformers) and pulled in an accelerate that eagerly imports
# boto3. Nothing in this project needs those exact versions.
dependencies = [
    "transformers>=4.51",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.3",
    "tokenizers>=0.21",
    "sentencepiece",
    "einops",
    "ninja",
    "pybind11>=2.12",
    "packaging",
    "numpy>=1.26.4",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "wandb",
    "pytest",
    "pytest-benchmark",
]

[project.optional-dependencies]
dev  = ["pytest", "pytest-benchmark", "pandas", "matplotlib", "seaborn", "wandb"]
jax  = ["jax[cuda12_pip]", "jaxlib"]
vllm = ["vllm>=0.5.3"]
all  = ["sparse-kv[dev,jax,vllm]"]

[tool.setuptools.packages.find]
where   = ["."]
include = ["sparse_kv*"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
python_files = ["test_*.py"]