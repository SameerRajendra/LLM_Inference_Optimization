name: CI

on:
  push:
    branches: [main, decode-engine]
  pull_request:
    branches: [main, decode-engine]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton pytest ruff numpy

      - name: Lint and syntax check
        run: |
          python -m py_compile sparse_kv/*.py triton_kernels/*.py benchmarks/*.py tests/*.py
          ruff check sparse_kv triton_kernels benchmarks/bench_serving_regime.py benchmarks/make_report.py benchmarks/profile_ncu.py benchmarks/profile_e2e_nsys.py benchmarks/bench_tp_decode.py modal_apps/bench_e2e_h100.py tests

      - name: Run CPU and Triton-interpret test suite
        env:
          TRITON_INTERPRET: "1"
        run: |
          pytest tests/ -v
